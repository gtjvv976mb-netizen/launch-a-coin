[workspace]
members = [
    "programs/*"
]
resolver = "2"

# card-program-v2 §13 step 3 / devnet-plan M1 task 3: shrink the .so (target <= 450 KB), keep overflow checks.
[profile.release]
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1
strip = true
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
