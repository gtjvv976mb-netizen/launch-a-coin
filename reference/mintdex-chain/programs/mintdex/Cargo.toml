[package]
name = "mintdex"
version = "0.2.0"
description = "MintDex card program v2: one-of-one evolving card NFTs, creator-fee vaults and a card market for pump.fun coins."
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "mintdex"

[features]
# no-idl: no Anchor IDL-account instructions in the .so. In Anchor 0.31 anyone can create the program's IDL account
# first (front-running `anchor idl init` with a fake IDL that explorers would trust), and they cost ~39 KB of program
# data. The IDL JSON is still generated by `anchor build` (target/idl/mintdex.json -> chain/sdk/idl). See
# card-program-v2 §18.2.
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "=0.31.1", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
spl-token-metadata-interface = "0.6"
# F14: the security.txt section in the .so (no transitive dependencies)
solana-security-txt = "=1.1.1"

[dev-dependencies]
# the runtime's instructions-sysvar serializer input type, for the EvolveMustBeAlone parser test
solana-instruction = { version = "2.3", features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
