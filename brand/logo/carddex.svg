  <linearGradient id="gold" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fff4ba"/><stop offset=".24" stop-color="#f8dc79"/><stop offset=".42" stop-color="#b27c21"/><stop offset=".49" stop-color="#fff1ad"/><stop offset=".67" stop-color="#d8ac46"/><stop offset=".87" stop-color="#fff2b8"/><stop offset="1" stop-color="#b48329"/></linearGradient>
